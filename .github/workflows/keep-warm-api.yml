name: Keep warm API

# Render free tier mematikan service setelah 15 menit idle. Ping tiap 10 menit
# membuat container tetap bangun sehingga pengunjung tidak kena cold start.
# 24/7 ≈ 730 jam/bulan, masih di bawah kuota Render free (750 jam/bulan).

on:
  schedule:
    # Setiap 10 menit (GitHub bisa menunda beberapa menit saat antrean ramai).
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm-api
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /api/health
        run: |
          set -euo pipefail
          url="https://queueexpress-api.onrender.com/api/health"
          # Cold start bisa ~60 detik; beri waktu dan ulangi sekali-dua kali.
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "$url"; then
              echo ""
              echo "OK pada percobaan $attempt"
              exit 0
            fi
            echo "Percobaan $attempt gagal, ulangi dalam 15 detik..."
            sleep 15
          done
          echo "API tidak merespons setelah 3 percobaan."
          exit 1
